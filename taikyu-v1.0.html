<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>周回順位カウント（クラス別順位対応）</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  table { border-collapse: collapse; margin-top: 20px; width: 60%; }
  th, td { border: 1px solid #aaa; padding: 5px; text-align: center; }
  .赤 { background-color: #ff9999; }
  .青 { background-color: #99ccff; }
  .黄 { background-color: #ffff99; }
  .緑 { background-color: #99ff99; }
  .オレンジ { background-color: #ffcc99; }
</style>
</head>
<body>
<h1>周回順位カウント（クラス別順位対応）</h1>
<button id="startBtn">音声入力開始</button>
<button id="stopBtn">音声入力停止</button>

<h2>トータル順位</h2>
<table id="totalTable">
  <thead>
    <tr><th>順位</th><th>ゼッケン</th><th>クラス</th><th>周回数</th></tr>
  </thead>
  <tbody></tbody>
</table>

<h2>クラス別順位</h2>
<div id="classTables"></div>

<script>
const racers = [
  { number: 1, color: '赤', laps: 0, timestamps: [] },
  { number: 2, color: '青', laps: 0, timestamps: [] },
  { number: 3, color: '黄', laps: 0, timestamps: [] },
  { number: 4, color: '緑', laps: 0, timestamps: [] },
  { number: 5, color: 'オレンジ', laps: 0, timestamps: [] }
];

const colors = ['赤','青','黄','緑','オレンジ'];

let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
} else if ('SpeechRecognition' in window) {
  recognition = new SpeechRecognition();
} else {
  alert("このブラウザでは音声認識が使えません");
}

recognition.lang = 'ja-JP';
recognition.continuous = true;
recognition.interimResults = false;

recognition.onresult = function(event) {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      const text = event.results[i][0].transcript.trim();
      processInput(text);
    }
  }
};

document.getElementById('startBtn').onclick = () => recognition.start();
document.getElementById('stopBtn').onclick = () => recognition.stop();

function processInput(text) {
  const match = text.match(/(赤|青|黄|緑|オレンジ)\s*(\d+)/);
  if (match) {
    const color = match[1];
    const number = parseInt(match[2]);
    const racer = racers.find(r => r.number === number && r.color === color);
    if (racer) {
      racer.laps++;
      racer.timestamps.push(Date.now());
      updateTables();
    }
  }
}

function updateTables() {
  updateTotalTable();
  updateClassTables();
}

function updateTotalTable() {
  const tbody = document.querySelector('#totalTable tbody');
  tbody.innerHTML = '';

  const sorted = [...racers].sort((a, b) => {
    if (b.laps !== a.laps) return b.laps - a.laps;
    return a.timestamps[a.timestamps.length-1] - b.timestamps[b.timestamps.length-1];
  });

  sorted.forEach((racer,index) => {
    const tr = document.createElement('tr');
    tr.className = racer.color;
    tr.innerHTML = `<td>${index+1}</td><td>${racer.number}</td><td>${racer.color}</td><td>${racer.laps}</td>`;
    tbody.appendChild(tr);
  });
}

function updateClassTables() {
  const container = document.getElementById('classTables');
  container.innerHTML = '';

  colors.forEach(color => {
    const classRacers = racers.filter(r => r.color === color)
      .sort((a, b) => {
        if (b.laps !== a.laps) return b.laps - a.laps;
        return a.timestamps[a.timestamps.length-1] - b.timestamps[b.timestamps.length-1];
      });
    if (classRacers.length === 0) return;

    const table = document.createElement('table');
    table.innerHTML = `<thead><tr><th>${color}クラス順位</th><th>ゼッケン</th><th>周回数</th></tr></thead><tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    classRacers.forEach((racer, idx) => {
      const tr = document.createElement('tr');
      tr.className = racer.color;
      tr.innerHTML = `<td>${idx+1}</td><td>${racer.number}</td><td>${racer.laps}</td>`;
      tbody.appendChild(tr);
    });
    container.appendChild(table);
  });
}
</script>

</body>
</html>
